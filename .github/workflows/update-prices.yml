name: Update ETF prices
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - name: Fetch prices
        run: |
          python - <<'PY'
          import json, datetime, yfinance as yf
          symbols={"EQQB":"EQQB.DE","VWCE":"VWCE.DE"}
          out={"updated":datetime.datetime.now(datetime.timezone.utc).isoformat(),"prices":{}}
          for k,s in symbols.items():
              t=yf.Ticker(s)
              p=t.fast_info.get("last_price")
              if p is None:
                  h=t.history(period="1d")
                  p=float(h["Close"].iloc[-1])
              out["prices"][k]=round(float(p),4)
          open("prices.json","w").write(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update ETF prices" && git push)
